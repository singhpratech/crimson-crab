[package]
name = "crimson-crab"
version = "0.2.1"
edition = "2021"
rust-version = "1.75"
authors = ["singhpratech"]
license = "MIT OR Apache-2.0"
description = "A Rust SDK for Anthropic's Claude API that can't panic on you: unwrap/expect/panic denied at compile time. Typed output and tools from Rust structs, streaming, thinking, caching, batches."
keywords = ["claude", "anthropic", "ai", "llm", "sdk"]
categories = ["api-bindings", "asynchronous", "web-programming::http-client"]
repository = "https://github.com/singhpratech/crimson-crab"
homepage = "https://singhpratech.github.io/crimson-crab/"
readme = "README.md"
documentation = "https://docs.rs/crimson-crab"

# Document the optional `schemars` API on docs.rs, which otherwise builds with
# default features only.
[package.metadata.docs.rs]
all-features = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures-core = "0.3"
futures-util = "0.3"
bytes = "1"
pin-project-lite = "0.2"
fastrand = "2"
schemars = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
] }
wiremock = "0.6"
anyhow = "1"

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]
# Derive JSON Schemas from Rust types: `messages().parse::<T>()` and
# `Tool::from_type::<T>()`. Not enabled by default.
schemars = ["dep:schemars"]

[[example]]
name = "typed_parse"
required-features = ["schemars"]

[[example]]
name = "typed_tools"
required-features = ["schemars"]
